services:
  - type: web
    name: mapa-luces-paraguay
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: Resultados_luces_nocturnas_Paraguay
      - key: LOCALITY_LIMIT
        value: "8000"
      - key: MAX_HOTSPOT_POINTS
        value: "3000"
